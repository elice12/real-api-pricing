name: Regenerate GOAT Nov 14 adopted data (one-off)
on:
  push:
    branches: [data/2026-11-14-crossvendor-round2]
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PYTHONIOENCODING: utf-8
      MPLBACKEND: Agg
      CHART_FONT_FALLBACK: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          npm ci
          npm --prefix web ci
      - name: Adopt and regenerate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _build
          python scripts/build_adopted.py > /dev/null
          python scripts/compute.py > /dev/null
          python - <<'PY'
          import json, csv, re, subprocess, sys
          from pathlib import Path
          path=Path("data/i18n/adopted.en.json")
          old=json.loads(path.read_text(encoding="utf-8"))
          by_old={r["zh"]:r["en"] for r in old["entries"] if r.get("en")}
          subprocess.run([sys.executable,"scripts/checks/verify_i18n.py","--sync"],stdout=subprocess.DEVNULL,check=False)
          doc=json.loads(path.read_text(encoding="utf-8"))
          with open("data/adopted.csv",encoding="utf-8-sig",newline="") as f:
              rows={(r["plan_id"],r["served_model"]):r for r in csv.DictReader(f)}
          def note(key):return rows[("command_code_goat",key)]["decision_note"]
          special={
              note("deepseek-v4.1-flash"):
                "7.2464B→10.352B: min(shared monthly pool $100, model allowance $100) / project standard workload blended price; official off-peak cached/input/output=$0.003/$0.15/$0.60, peak 2×. On 2026-11-14 the official GOAT model monthly cap is $100, matching the $100 overall pool; crossvendor-official-round2-2026-11-14.json. Official request estimates are cross-checks, not the primary adopted allowance; processing fee ignored; model allowances cannot be added",
              note("glm-5.3"):
                "Added 226.4M: min(shared monthly pool $100, model allowance $70) / project standard workload blended price; boosted $20→$70 credits on 2026-11-13, reconfirmed 11-14; crossvendor-official-round2-2026-11-14.json. Processing fee ignored; other model allowances not additive; no usage-panel token+% screenshot, based on official absolute credits and prices",
              note("glm-5.3-flash"):
                "Added 2.2631B: min(shared monthly pool $100, model allowance $80) / project standard workload blended price; official standing model allowance $80; official $100 boost marked while capacity lasts with no end date, excluded from permanent comparison; crossvendor-official-round2-2026-11-14.json. Processing fee ignored; allowances not additive; no usage-panel token+% screenshot, derived from official credits and prices",
              note("ling-3.1-flash"):
                next(e["en"] for e in old["entries"] if "goat-ling31-flash-round2-2026-10-16.json" in e["zh"])
                  .replace("Added 997.2M:", "Added 1.4245B:")
                  .replace("min(shared monthly pool $70, model allowance $100)", "min(shared monthly pool $100, model allowance $100)")
                  .replace("effective = min($70 shared pool, $100) = $70", "effective = min($100 shared pool, $100) = $100; crossvendor-official-round2-2026-11-14.json")
          }
          deep_src=rows[("command_code_goat","deepseek-v4.1-flash")]["source"]
          special[deep_src]="https://commandcode.ai/docs/plans/goat official per-model allowance and three-part pricing; https://commandcode.ai/pricing; GOAT up to $100 model-specific credits (2026-11-14); command-code-goat-deepseek-round2-2026-09-30.json"
          unresolved=[]
          for e in doc["entries"]:
              if e.get("en"):continue
              zh=e["zh"]
              if zh in special:
                  e["en"]=special[zh]
                  continue
              ancestor=zh.replace("共享月池$100","共享月池$70").replace("min(shared monthly pool $100","min(shared monthly pool $70")
              if ancestor in by_old:
                  e["en"]=by_old[ancestor].replace("shared monthly pool $70","shared monthly pool $100")
                  continue
              unresolved.append(zh[:160])
          if unresolved:
              raise AssertionError("Untranslated new strings: "+repr(unresolved))
          path.write_text(json.dumps(doc,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          PY
          python scripts/checks/verify_i18n.py
          python scripts/readme_stats.py
          python scripts/checks/verify_benchmark_configs.py
          python scripts/checks/verify_aa_snapshot.py
          python scripts/checks/verify_deepswe.py
          python scripts/plot_svg.py > /dev/null
          node scripts/render_svg.cjs > /dev/null
          python scripts/build_html.py > /dev/null
          python scripts/plot_quotas.py > _build/goat-plot.log 2>&1 || { tail -n 100 _build/goat-plot.log; exit 1; }
          node scripts/checks/verify_configuration_html.cjs
          python scripts/checks/verify_fee_bands.py
          python scripts/checks/verify_chart_labels.py
          python scripts/publish_charts.py
          python scripts/checks/verify_svg.py
          python scripts/checks/verify_label_overlap.py
          python scripts/checks/verify_four_boards.py
          python scripts/checks/verify_publication.py
          python scripts/checks/verify_palette.py
          npm --prefix web test
          npm --prefix web run build
      - name: Verify four adopted changes and all other numerical records unchanged
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv,io,subprocess
          from pathlib import Path
          def parse(t):
              return {(r["plan_id"],r["served_model"]):r for r in csv.DictReader(io.StringIO(t))}
          old=parse(subprocess.check_output(["git","show","HEAD:data/adopted.csv"],encoding="utf-8-sig"))
          now=parse(Path("data/adopted.csv").read_text(encoding="utf-8-sig"))
          keys={
              ("command_code_goat","deepseek-v4.1-flash"):103.52,
              ("command_code_goat","glm-5.3"):2.264,
              ("command_code_goat","glm-5.3-flash"):22.631,
              ("command_code_goat","ling-3.1-flash"):14.245
          }
          assert set(old)==set(now), f"Plan/model set changed: {set(old)^set(now)}"
          fields=("price","price_usd","monthly_yi","monthly_tokens","real_usd_per_mtok","unmetered","promo_until","data_date","confidence")
          unexpected=[(key,field) for key,r in old.items() if key not in keys for field in fields if r[field]!=now[key][field]]
          assert not unexpected, f"Unrelated numeric/date changes: {unexpected[:12]}"
          for k,v in keys.items():
              assert float(now[k]["monthly_yi"])==v,(k,now[k]["monthly_yi"],v)
              assert now[k]["data_date"]=="2026-11-14",k
          assert len(now)==404
          print(f"PASS: 404 points; 4 targeted GOAT rows; {len(now)-4} other rows unchanged")
          PY
      - name: Commit generated output and remove one-off generator
        shell: bash
        run: |
          set -euo pipefail
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git rm -f .github/workflows/goat-adopt-regenerate-once.yml
          git add -A
          git diff --cached --check -- scripts/ web/ docs/ DECISIONS.md
          git commit -m "build: regenerate 2026-11-14 GOAT credits, translations and charts"
          git push origin HEAD:refs/heads/data/2026-11-14-crossvendor-round2
