name: November 2026 adopted-data regeneration
on:
  push:
    branches: [data/2026-11-14-adopted-refresh]
    paths:
      - scripts/build_adopted.py
      - data/conventions.json
      - .github/workflows/refresh-data-2026-11.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: refresh-data-2026-11
  cancel-in-progress: false
jobs:
  rebuild:
    name: Regenerate adopted CSV, charts, tables, i18n
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PYTHONIOENCODING: utf-8
      MPLBACKEND: Agg
      CHART_FONT_FALLBACK: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install render and pipeline dependencies
        run: |
          python -m pip install -r requirements.txt
          npm ci
      - name: Rebuild adopted dataset and derived ranking points
        run: |
          python scripts/build_adopted.py > /dev/null
          python scripts/compute.py > /dev/null
          python scripts/readme_stats.py
          python scripts/checks/verify_i18n.py --sync
      - name: Rebuild all charts, HTML and tables
        run: |
          mkdir -p _build
          python scripts/plot_svg.py > /dev/null
          node scripts/render_svg.cjs > /dev/null
          python scripts/build_html.py > /dev/null
          python scripts/plot_quotas.py > _build/plot_quotas.refresh.log 2>&1 || { tail -n 100 _build/plot_quotas.refresh.log; exit 1; }
          python scripts/publish_charts.py
      - name: Validate generated data and plots
        run: |
          python scripts/readme_stats.py --check
          python scripts/checks/verify_i18n.py
          python scripts/checks/verify_benchmark_configs.py
          python scripts/checks/verify_aa_snapshot.py
          python scripts/checks/verify_deepswe.py
          python scripts/checks/verify_palette.py
          python scripts/checks/verify_fee_bands.py
          python scripts/checks/verify_chart_labels.py
          python scripts/checks/verify_svg.py
          python scripts/checks/verify_four_boards.py > /dev/null
          python scripts/checks/verify_publication.py
          # Generated CSV uses CRLF; git diff --check treats those line endings as trailing whitespace.
          git diff --check -- README.md README.zh.md
      - name: Commit reproducible generated assets back to update branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- data derived charts README.md README.zh.md
          if git diff --staged --quiet; then
            echo "No generated changes to commit"
          else
            git commit -m "build: regenerate November 14 adopted CSV and charts"
            git push origin HEAD:data/2026-11-14-adopted-refresh
          fi
