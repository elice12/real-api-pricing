name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      PYTHONIOENCODING: utf-8

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install CJK fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install root Node dependencies
        run: npm install --package-lock=false --no-audit --no-fund

      - name: Install web dependencies
        run: npm --prefix web ci

      - name: Rebuild adopted and derived data
        run: |
          python scripts/build_adopted.py
          python scripts/compute.py

      - name: Verify benchmark configurations
        run: python scripts/checks/verify_benchmark_configs.py

      - name: Rebuild charts and interactive HTML
        run: |
          python scripts/plot_svg.py
          node scripts/render_svg.cjs
          python scripts/build_html.py
          node scripts/checks/verify_configuration_html.cjs
          python scripts/plot_quotas.py
          python scripts/publish_charts.py

      - name: Verify rebuilt publication
        run: |
          python scripts/checks/verify_svg.py
          python scripts/checks/verify_four_boards.py
          python scripts/checks/verify_publication.py

      - name: Report generated differences
        shell: bash
        run: |
          if git diff --quiet -- data/adopted.csv derived charts; then
            echo "Committed generated outputs match regeneration."
          else
            echo "::warning::Cloud regeneration changed committed generated outputs. Run the Rebuild data and charts workflow to publish them."
            git diff --stat -- data/adopted.csv derived charts
          fi

      - name: Test web app
        run: npm --prefix web test

      - name: Build web app
        run: npm --prefix web run build
