name: Rebuild data and charts

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rebuild-main
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    env:
      PYTHONIOENCODING: utf-8

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install CJK fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install root Node dependencies
        run: npm install --no-audit --no-fund

      - name: Install web dependencies
        run: npm --prefix web ci

      - name: Rebuild adopted and derived data
        run: |
          python scripts/build_adopted.py
          python scripts/compute.py
          python scripts/checks/verify_benchmark_configs.py

      - name: Rebuild charts and interactive HTML
        run: |
          python scripts/plot_svg.py
          node scripts/render_svg.cjs
          python scripts/build_html.py
          node scripts/checks/verify_configuration_html.cjs
          python scripts/plot_quotas.py
          python scripts/publish_charts.py

      - name: Verify rebuilt publication
        run: |
          python scripts/checks/verify_svg.py
          python scripts/checks/verify_four_boards.py
          python scripts/checks/verify_publication.py

      - name: Test and build web app
        run: |
          npm --prefix web test
          npm --prefix web run build

      - name: Show generated changes
        run: git status --short

      - name: Commit regenerated outputs
        id: commit
        shell: bash
        run: |
          git add data/adopted.csv derived charts
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No generated changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: rebuild generated data and charts"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Rebase on latest main and push
        if: steps.commit.outputs.changed == 'true'
        run: |
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
